name: CD — Build AMI & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PACKER_VERSION: "1.11.2"

permissions:
  id-token: write
  contents: read

jobs:
  build-ami:
    name: Build AMI with Packer
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.packer-build.outputs.ami_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        working-directory: packer
        run: packer init ubuntu.pkr.hcl

      - name: Packer Validate
        working-directory: packer
        run: packer validate ubuntu.pkr.hcl

      - name: Packer Build AMI
        id: packer-build
        working-directory: packer
        run: |
          packer build \
            -var "app_version=${{ github.sha }}" \
            -machine-readable \
            ubuntu.pkr.hcl | tee build.log

          AMI_ID=$(grep 'artifact,0,id' build.log | cut -d, -f6 | cut -d: -f2)
          echo "ami_id=${AMI_ID}" >> $GITHUB_OUTPUT
          echo "Built AMI: ${AMI_ID}"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log
          path: packer/build.log

  deploy-infrastructure:
    name: Deploy Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: build-ami
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get App URL
        working-directory: terraform
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "App deployed at: $APP_URL"

  trigger-instance-refresh:
    name: Trigger ASG Instance Refresh
    runs-on: ubuntu-latest
    needs: [build-ami, deploy-infrastructure]

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          ASG_NAME="aws-devops-app-asg"
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "Instance refresh started: $REFRESH_ID"

          aws autoscaling wait instance-refresh-complete \
            --auto-scaling-group-name "$ASG_NAME"

          echo "Deployment complete!"
